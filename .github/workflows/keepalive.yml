name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; :17 avoids top-of-hour queue delays
    - cron: "0 3 * * 1"      # weekly heartbeat commit (Mondays 03:00 UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      - name: Visit apps
        run: python keepalive.py

      - name: Upload screenshots of failed apps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/

      # GitHub disables scheduled workflows after 60 days with no repo activity.
      # A small weekly commit prevents that.
      - name: Weekly heartbeat commit
        if: always() && github.event.schedule == '0 3 * * 1'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "Weekly heartbeat" || exit 0
          git push
